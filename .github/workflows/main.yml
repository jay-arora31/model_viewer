name: Deploy to S3 + CloudFront

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

env:
  BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync static assets (long cache)
        run: |
          aws s3 sync "$BUILD_DIR" "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --exclude "index.html" \
            --exclude "asset-manifest.json" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html (short cache)
        run: |
          aws s3 cp "$BUILD_DIR/index.html" "s3://${{ secrets.S3_BUCKET }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Find CloudFront distribution for S3 origin
        id: finddist
        run: |
          ORIGIN="${{ secrets.S3_BUCKET }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com"
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?contains(join(',', Origins.Items[].DomainName), '${ORIGIN}')].Id | [0]" \
            --output text)
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "No distribution found for origin ${ORIGIN}"
            exit 1
          fi
          echo "dist_id=$DIST_ID" >> $GITHUB_OUTPUT
          echo "Resolved distribution: $DIST_ID"

      - name: Create CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.finddist.outputs.dist_id }}" \
            --paths "/*"
